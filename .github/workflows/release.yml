name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: runner.os == 'Linux' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
        shell: bash
      - name: Package
        shell: bash
        run: |
          set -e
          name="meshirc-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p dist/"$name"
          cp README.md dist/"$name"/
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/meshirc.exe dist/"$name"/
            (cd dist && 7z a "$name.zip" "$name" > /dev/null)
          else
            cp target/${{ matrix.target }}/release/meshirc dist/"$name"/
            (cd dist && tar czf "$name.tar.gz" "$name")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: meshirc-${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}

  freebsd:
    name: x86_64-unknown-freebsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub has no FreeBSD runners: build natively in a FreeBSD 15.1-RELEASE VM.
      # The workspace is synced into the VM and copied back afterwards.
      - name: Build in FreeBSD 15.1 VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          prepare: |
            pkg install -y curl
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          run: |
            set -e
            . "$HOME/.cargo/env"
            freebsd-version
            cargo build --release --locked
      - name: Package
        run: |
          set -e
          name="meshirc-${GITHUB_REF_NAME}-x86_64-unknown-freebsd"
          mkdir -p dist/"$name"
          cp README.md target/release/meshirc dist/"$name"/
          (cd dist && tar czf "$name.tar.gz" "$name")
      - uses: actions/upload-artifact@v4
        with:
          name: meshirc-x86_64-unknown-freebsd
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, freebsd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
