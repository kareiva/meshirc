<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeshIRC</title>
<style>
:root {
  --side-bg: #303e4a; --side-fg: #b7c5d1; --side-hover: #3a4b59; --side-active: #4b5c6a; --side-head: #fff;
  --bg: #fff; --fg: #222; --muted: #8a959f; --line: #e7eaec; --head-bg: #fff; --hl: #fff6d6;
  --link: #50a656; --ok: #2ea043; --bad: #d1242f; --badge: #e06c75;
}
@media (prefers-color-scheme: dark) {
  :root { --side-bg: #1c2128; --side-fg: #9aa7b3; --side-hover: #262d36; --side-active: #313a45;
    --bg: #22272e; --fg: #d5dbe1; --muted: #7d8893; --line: #2d333b; --head-bg: #22272e; --hl: #3a3423; --link: #6cc070; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; background: var(--bg); color: var(--fg);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
#side { width: 220px; flex: none; background: var(--side-bg); color: var(--side-fg); display: flex; flex-direction: column; }
#side h1 { margin: 0; padding: 14px 16px 10px; font-size: 15px; color: var(--side-head); display: flex; align-items: center; gap: 8px; }
#side h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
#side h1 .dot.off { background: var(--bad); }
#side h2 { margin: 10px 16px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; opacity: .7; }
#list { overflow-y: auto; flex: 1; padding-bottom: 12px; }
.tab { display: flex; align-items: center; padding: 5px 16px; cursor: pointer; white-space: nowrap; }
.tab:hover { background: var(--side-hover); }
.tab.active { background: var(--side-active); color: #fff; }
.tab .n { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.tab.unread .n { color: #fff; font-weight: 600; }
.badge { background: var(--badge); color: #fff; border-radius: 9px; font-size: 11px; padding: 0 6px; margin-left: 6px; }
main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
header { display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 46px; flex: none;
  border-bottom: 1px solid var(--line); background: var(--head-bg); }
header h2 { margin: 0; font-size: 15px; }
header .kind { color: var(--muted); font-size: 12px; }
#menu { display: none; background: none; border: 0; color: var(--fg); font-size: 20px; cursor: pointer; padding: 4px; }
#msgs { flex: 1; overflow-y: auto; padding: 8px 0; }
.row { display: flex; padding: 1px 16px; gap: 10px; }
.row:hover { background: color-mix(in srgb, var(--line) 50%, transparent); }
.row.hl { background: var(--hl); }
.row.old { opacity: .7; }
.t { color: var(--muted); font-size: 12px; flex: none; width: 3.2em; padding-top: 1px; font-variant-numeric: tabular-nums; }
.nick { flex: none; width: 9em; text-align: right; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.text { flex: 1; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.notice .text { color: var(--muted); font-style: italic; }
.notice .nick { color: var(--muted); font-weight: normal; }
.mark { font-size: 10px; margin-left: 6px; color: var(--muted); }
.mark.heard, .mark.acked { color: var(--ok); }
.mark.failed { color: var(--bad); }
.mention { font-weight: 600; color: var(--link); }
a { color: var(--link); }
footer { flex: none; padding: 8px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
#empty { color: var(--muted); padding: 24px 16px; }
@media (max-width: 700px) {
  #side { position: fixed; z-index: 2; inset: 0 auto 0 0; transform: translateX(-100%); transition: transform .2s; }
  body.open #side { transform: none; box-shadow: 0 0 24px rgba(0,0,0,.4); }
  #menu { display: block; }
  /* IRC-style flow: "08:57 Nick text…", wrapping under the time */
  .row { display: block; }
  .t, .nick, .text { display: inline; width: auto; }
  .nick { text-align: left; white-space: nowrap; }
  .notice .nick { display: none; }
}
</style>
</head>
<body>
<nav id="side">
  <h1><span class="dot" id="dot"></span><span id="node">MeshIRC</span></h1>
  <div id="list"></div>
</nav>
<main>
  <header><button id="menu" aria-label="Channels">☰</button><h2 id="title"></h2><span class="kind" id="kind"></span></header>
  <div id="msgs"><div id="empty">Loading…</div></div>
  <footer>Read-only view · updates automatically</footer>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
let state = { me: "", connected: false, windows: [] };
let etag = null;
let active = decodeURIComponent(location.hash.slice(1));
let seen = {};
try { seen = JSON.parse(localStorage.getItem("meshirc-seen") || "{}"); } catch (e) {}
let renderedKey = null;

const msgCount = w => w.lines.filter(l => l.k === "msg" && !l.old).length;
function saveSeen() { try { localStorage.setItem("meshirc-seen", JSON.stringify(seen)); } catch (e) {} }
function hue(s) { let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) >>> 0; return h % 360; }
function isMention(text) { return state.me && (text.includes("@[" + state.me + "]") || text.includes("@" + state.me)); }

// Text with URLs linked and @[Name] mentions highlighted, built from DOM nodes (no innerHTML).
function richText(el, text) {
  const re = /(https?:\/\/[^\s<>"]+)|(@\[[^\]]+\])/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) el.append(text.slice(last, m.index));
    if (m[1]) { const a = document.createElement("a"); a.href = m[1]; a.textContent = m[1]; a.target = "_blank"; a.rel = "noopener noreferrer"; el.append(a); }
    else { const s = document.createElement("span"); s.className = "mention"; s.textContent = m[2]; el.append(s); }
    last = re.lastIndex;
  }
  if (last < text.length) el.append(text.slice(last));
}

const MARKS = { pending: "○", heard: "●", acked: "●●", failed: "●" };

function renderList() {
  const list = $("list");
  list.textContent = "";
  let group = null;
  for (const w of state.windows) {
    if (w.kind !== group) {
      group = w.kind;
      const h = document.createElement("h2");
      h.textContent = group === "channel" ? "Channels" : "Private";
      list.append(h);
    }
    const tab = document.createElement("div");
    tab.className = "tab" + (w.id === active ? " active" : "");
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = w.name;
    tab.append(n);
    const unread = w.id === active ? 0 : Math.max(0, msgCount(w) - (seen[w.id] || 0));
    if (unread) {
      tab.classList.add("unread");
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = unread > 99 ? "99+" : unread;
      tab.append(b);
    }
    tab.onclick = () => { select(w.id); document.body.classList.remove("open"); };
    list.append(tab);
  }
}

function renderMsgs() {
  const w = state.windows.find(w => w.id === active);
  const box = $("msgs");
  $("title").textContent = w ? w.name : "";
  $("kind").textContent = w ? (w.kind === "channel" ? "channel" : "private conversation") : "";
  document.title = (w ? w.name + " — " : "") + "MeshIRC";
  const key = w ? w.id + "\n" + JSON.stringify(w.lines) : "";
  if (key === renderedKey) return;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40 || renderedKey === null || !renderedKey.startsWith(active + "\n");
  renderedKey = key;
  box.textContent = "";
  if (!w) {
    const e = document.createElement("div");
    e.id = "empty";
    e.textContent = state.windows.length ? "Pick a channel." : "No channels yet.";
    box.append(e);
    return;
  }
  for (const l of w.lines) {
    const row = document.createElement("div");
    row.className = "row " + l.k + (l.old ? " old" : "") + (l.k === "msg" && !l.own && isMention(l.text) ? " hl" : "");
    const t = document.createElement("span"); t.className = "t"; t.textContent = l.t || "";
    const nick = document.createElement("span"); nick.className = "nick";
    if (l.k === "msg") { nick.textContent = l.nick; nick.style.color = `hsl(${hue(l.nick)} 55% 45%)`; } else nick.textContent = "*";
    const text = document.createElement("span"); text.className = "text";
    richText(text, l.text);
    if (l.mark) { const m = document.createElement("span"); m.className = "mark " + l.mark; m.textContent = MARKS[l.mark] || ""; m.title = l.mark; text.append(m); }
    // real spaces so copied text reads "08:57 Nick text" (ignored by the desktop flex layout)
    row.append(t, " ", nick, " ", text);
    box.append(row);
  }
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function select(id) {
  active = id;
  history.replaceState(null, "", "#" + encodeURIComponent(id));
  render();
}

function render() {
  if (!state.windows.some(w => w.id === active) && state.windows.length) active = state.windows[0].id;
  const w = state.windows.find(w => w.id === active);
  if (w) { seen[w.id] = msgCount(w); saveSeen(); }
  $("node").textContent = state.me || "MeshIRC";
  $("dot").classList.toggle("off", !state.connected);
  $("dot").title = state.connected ? "radio connected" : "radio disconnected";
  renderList();
  renderMsgs();
}

async function poll() {
  try {
    const r = await fetch("/api/state", { cache: "no-store", headers: etag ? { "If-None-Match": etag } : {} });
    if (r.status === 200) { etag = r.headers.get("ETag"); state = await r.json(); render(); }
    $("dot").classList.toggle("off", !state.connected);
  } catch (e) {
    $("dot").classList.add("off");
    $("dot").title = "MeshIRC not reachable";
  }
  setTimeout(poll, 2000);
}

$("menu").onclick = () => document.body.classList.toggle("open");
window.addEventListener("hashchange", () => { active = decodeURIComponent(location.hash.slice(1)); render(); });
poll();
</script>
</body>
</html>
